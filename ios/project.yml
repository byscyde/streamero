# XcodeGen spec: `xcodegen generate` produces STREAMERO.xcodeproj (not committed).
name: STREAMERO
options:
  bundleIdPrefix: com.scyde
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  StreameroKit:
    path: Packages/StreameroKit
targets:
  STREAMERO:
    type: application
    platform: iOS
    sources:
      - path: STREAMERO
    dependencies:
      - package: StreameroKit
      - sdk: LocalAuthentication.framework
    info:
      path: STREAMERO/Info.plist
      properties:
        CFBundleDisplayName: Streamero
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSFaceIDUsageDescription: Streamero uses Face ID to keep your server administration locked.
        # Services are normally reached over HTTPS; local http:// addresses (e.g. 192.168.x.x) are allowed for home networks.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Streamero connects to your media servers on the local network when you enter a local address.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STREAMERO_BUNDLE_ID)
        STREAMERO_BUNDLE_ID: com.scyde.streamero
        PRODUCT_NAME: STREAMERO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
  STREAMEROTests:
    type: bundle.unit-test
    platform: iOS
    sources: [STREAMEROTests]
    dependencies:
      - target: STREAMERO
      - package: StreameroKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/STREAMERO.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/STREAMERO
  STREAMEROUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [STREAMEROUITests]
    dependencies:
      - target: STREAMERO
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: STREAMERO
schemes:
  STREAMERO:
    build:
      targets:
        STREAMERO: all
    test:
      targets: [STREAMEROTests, STREAMEROUITests]
      gatherCoverageData: false

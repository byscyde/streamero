# XcodeGen spec: `xcodegen generate` produces STREAMERO.xcodeproj (not committed; see docs/IOS_BUILD.md).
name: STREAMERO
options:
  bundleIdPrefix: com.streamero
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  StreameroCore:
    path: Packages/StreameroCore
targets:
  STREAMERO:
    type: application
    platform: iOS
    sources:
      - path: STREAMERO
    dependencies:
      - package: StreameroCore
      - sdk: CarPlay.framework
      - sdk: AVKit.framework
      - sdk: MediaPlayer.framework
      - sdk: AuthenticationServices.framework
    entitlements:
      path: STREAMERO/STREAMERO.entitlements
      properties:
        com.apple.developer.carplay-audio: true
        com.apple.developer.applesignin: [Default]
    info:
      path: STREAMERO/Info.plist
      properties:
        CFBundleDisplayName: STREAMERO
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UIBackgroundModes: [audio, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.streamero.sync]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: com.streamero.links
            CFBundleURLSchemes: [streamero]
        # The app only talks to the STREAMERO service over HTTPS (default App Transport Security).
        StreameroServerURL: $(STREAMERO_SERVER_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STREAMERO_BUNDLE_ID)
        STREAMERO_BUNDLE_ID: com.example.streamero
        STREAMERO_SERVER_URL: "https://app.streamero.net"
        PRODUCT_NAME: STREAMERO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  STREAMEROTests:
    type: bundle.unit-test
    platform: iOS
    sources: [STREAMEROTests]
    dependencies:
      - target: STREAMERO
      - package: StreameroCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/STREAMERO.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/STREAMERO
  STREAMEROUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [STREAMEROUITests]
    dependencies:
      - target: STREAMERO
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: STREAMERO
schemes:
  STREAMERO:
    shared: true
    build:
      targets:
        STREAMERO: all
        STREAMEROTests: [test]
        STREAMEROUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - STREAMEROTests
        - STREAMEROUITests
    archive:
      config: Release

# Virtual host for an EXISTING nginx on the host, proxying to STREAMERO (docker, 127.0.0.1:8088).
#   sudo cp infra/host-nginx-streamero.conf /etc/nginx/sites-available/streamero.conf
#   sudo sed -i 's/music.example.com/TVOJA.DOMENA/g' /etc/nginx/sites-available/streamero.conf
#   sudo ln -s /etc/nginx/sites-available/streamero.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d TVOJA.DOMENA          # adds the HTTPS server block + auto-renewal
#
# Settings that matter for STREAMERO:
#  - client_max_body_size ≥ 10m      (uploads are sent in 8 MB chunks)
#  - proxy_buffering / proxy_request_buffering off (audio/video streaming, Range requests, uploads)
#  - long timeouts                   (large uploads, long HLS sessions)

upstream streamero {
    server 127.0.0.1:8088;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name music.example.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://streamero;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

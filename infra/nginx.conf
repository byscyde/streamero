# Public entry point. Only this container publishes a port; PostgreSQL, Redis and MinIO stay on the
# internal network. Terminate TLS here (or in front of it) in production — see docs/DEPLOYMENT.md.
#
#   /            web player (single-page app, web/)       /admin/   admin dashboard (admin/)
#   /v1/         API, signed media URLs and HLS            /docs, /openapi.json, /healthz, /readyz
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
  listen 80;
  server_name _;
  client_max_body_size 10m;          # upload chunks are 8 MB
  server_tokens off;

  # Compress static text assets (proxied API responses are left alone: gzip_proxied is off).
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # API (also serves signed media URLs and HLS)
  location /v1/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;              # stream media and range responses straight through
    proxy_request_buffering off;      # don't spool upload chunks to disk
    proxy_read_timeout 300s;
  }

  location /v1/auth/ {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz { proxy_pass http://api:8080; }
  location = /readyz  { proxy_pass http://api:8080; }
  location /docs      { proxy_pass http://api:8080; }
  location = /openapi.json { proxy_pass http://api:8080; }
  # Prometheus metrics are internal only (scrape api:8080/metrics on the private network).
  location = /metrics { return 404; }

  # Admin dashboard (single-page app)
  location /admin/ {
    alias /usr/share/nginx/admin/;
    try_files $uri $uri/ /admin/index.html;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
  }
  location = /admin { absolute_redirect off; return 301 /admin/; }

  # ---- Web player (single-page app) at the site root -------------------------------------------
  # add_header in a location replaces the server-level headers, so every web location repeats the
  # full set via the snippet below. Referrer: the YouTube embed player needs the origin to load, so
  # the web app uses strict-origin-when-cross-origin (never sends paths or queries cross-origin).
  root /usr/share/nginx/web;

  # Content-hashed bundles: cache for a year, never revalidate.
  location /assets/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  location = /manifest.webmanifest {
    types { } default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # index.html (direct and as SPA fallback) must always be revalidated so new deploys are picked up.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  }

  # Everything else: static files from the build (icons, logo), otherwise the SPA entry point so
  # deep links such as /artist/<id>, /reset-password?token=… and /verify-email?token=… work.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
}

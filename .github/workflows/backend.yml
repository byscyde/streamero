name: Backend & Admin

on:
  push:
    branches: ['**']
    paths: ['backend/**', 'admin/**', 'docker-compose.yml', 'infra/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'admin/**', 'docker-compose.yml', 'infra/**']
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: streamero, POSTGRES_PASSWORD: streamero, POSTGRES_DB: streamero_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U streamero" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - name: OpenAPI is up to date
        run: |
          JWT_ACCESS_SECRET=ci-secret-ci-secret-ci-secret-ci-secret MEDIA_SIGNING_SECRET=ci-secret-ci-secret-ci-secret-ci-secret \
          DATABASE_URL=postgres://streamero:streamero@localhost:5432/streamero_test node dist/openapi-cli.js /tmp/openapi.json
          diff <(jq -S . /tmp/openapi.json) <(jq -S . ../docs/openapi.json) > /dev/null || { echo "docs/openapi.json is stale: run npm run openapi -- ../docs/openapi.json"; exit 1; }

  admin:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: admin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build the stack
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/; s/^S3_SECRET_KEY=.*/S3_SECRET_KEY=ci-s3-secret/; s/^JWT_ACCESS_SECRET=.*/JWT_ACCESS_SECRET=$(openssl rand -hex 32)/; s/^MEDIA_SIGNING_SECRET=.*/MEDIA_SIGNING_SECRET=$(openssl rand -hex 32)/; s/^BOOTSTRAP_ADMIN_PASSWORD=.*/BOOTSTRAP_ADMIN_PASSWORD=ci-admin-password/" .env
          docker compose config -q
          docker compose up -d --build --wait --wait-timeout 300 api nginx
          curl -fsS http://localhost:8088/readyz
          curl -fsS -o /dev/null http://localhost:8088/admin/
          curl -fsS http://localhost:8088/v1/auth/login -H 'content-type: application/json' -d '{"email":"admin@streamero.local","password":"ci-admin-password"}' | jq -e .accessToken > /dev/null
      - if: failure()
        run: docker compose logs --tail 200

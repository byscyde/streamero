# STREAMERO — reproducible development/self-hosting stack.
#   cp .env.example .env   # then set real secrets
#   docker compose up -d --build
# Only nginx publishes a port. Data lives in named volumes.
name: streamero

x-backend-env: &backend-env
  NODE_ENV: ${NODE_ENV:-production}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8088}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  DATABASE_URL: postgres://streamero:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/streamero
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
  MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:?set MEDIA_SIGNING_SECRET}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://s3:8333
  S3_BUCKET: streamero-media
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-streamero}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: "true"
  WORK_DIR: /data/work
  IMPORT_ALLOWED_HOSTS: ${IMPORT_ALLOWED_HOSTS:-}
  IMPORT_ALLOWED_DIRS: ${IMPORT_ALLOWED_DIRS:-}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-STREAMERO <no-reply@scyde.dev>}
  APP_LINK_BASE: ${APP_LINK_BASE:-https://app.streamero.net/}
  APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-}
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@streamero.local}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streamero
      POSTGRES_USER: streamero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamero -d streamero"]
      interval: 5s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  # S3-compatible object storage (SeaweedFS). Swap for AWS S3, Cloudflare R2, Backblaze B2, Garage, etc.
  # by changing S3_ENDPOINT and credentials; the API creates the bucket if it doesn't exist.
  s3:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"streamero","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024 -volume.max=0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-streamero}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      retries: 30
    networks: [internal]
    restart: unless-stopped

  api:
    build: ./backend
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    volumes: [work:/data/work]
    # egress: outbound HTTPS/SMTP only (mail, MusicBrainz, YouTube Data API, Apple keys); no published ports.
    networks: [internal, egress]
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["node", "dist/worker.js"]
    healthcheck:
      disable: true # no HTTP server; liveness is the Redis heartbeat shown in Admin › System health
    environment:
      <<: *backend-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      FFMPEG_THREADS: ${FFMPEG_THREADS:-2}
    depends_on:
      api: { condition: service_healthy }
    # FFmpeg isolation: unprivileged user, read-only root, no capabilities, bounded CPU/memory,
    # scratch space only in its own volume.
    read_only: true
    tmpfs: [/tmp]
    volumes: [work:/data/work]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: ${WORKER_CPUS:-2}
    mem_limit: ${WORKER_MEMORY:-2g}
    pids_limit: 256
    networks: [internal, egress]
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: infra/nginx.Dockerfile
    depends_on:
      api: { condition: service_healthy }
    ports: ["${HTTP_PORT:-8088}:80"]
    networks: [internal, egress]
    restart: unless-stopped

networks:
  internal:
    internal: true   # no internet access, not reachable from outside
  egress: {}         # outbound access for api/worker (mail, metadata, URL imports) and the public nginx port

volumes:
  pgdata:
  redisdata:
  s3data:
  work:

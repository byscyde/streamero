# Import music/video already stored on this server.
#   cp docker-compose.import.example.yml docker-compose.import.yml
#   edit the host path below, set IMPORT_ALLOWED_DIRS=/import in .env, then re-run the installer
#   (or: docker compose -f docker-compose.yml -f docker-compose.localhost.yml -f docker-compose.import.yml up -d)
# The folder is mounted READ-ONLY; STREAMERO copies files into its own storage when importing.
services:
  worker:
    volumes:
      - work:/data/work
      - /srv/glazba:/import:ro
